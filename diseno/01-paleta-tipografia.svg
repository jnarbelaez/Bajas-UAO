<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#e2001a">Guía Visual · Paleta y Tipografía</text>
  <text x="40" y="72" font-size="13" fill="#6b7688">Dashboard Bajas de Activos TI — Universidad Autónoma de Occidente</text>
  <line x1="40" y1="88" x2="960" y2="88" stroke="#e6eaf2"/>

  <!-- PALETA PRIMARIA -->
  <text x="40" y="124" font-size="16" font-weight="700" fill="#1b2330">1. Colores primarios (marca)</text>
  <g>
    <rect x="40" y="140" width="150" height="90" rx="10" fill="#e2001a"/>
    <text x="52" y="210" font-size="13" font-weight="700" fill="#fff">#E2001A</text>
    <text x="52" y="226" font-size="10" fill="#ffd0d6">Rojo UAO (principal)</text>
    <rect x="206" y="140" width="150" height="90" rx="10" fill="#2563eb"/>
    <text x="218" y="210" font-size="13" font-weight="700" fill="#fff">#2563EB</text>
    <text x="218" y="226" font-size="10" fill="#cfe0ff">Azul (acento)</text>
    <rect x="372" y="140" width="150" height="90" rx="10" fill="#1b2330"/>
    <text x="384" y="210" font-size="13" font-weight="700" fill="#fff">#1B2330</text>
    <text x="384" y="226" font-size="10" fill="#aab4c4">Texto principal</text>
    <rect x="538" y="140" width="150" height="90" rx="10" fill="#6b7688"/>
    <text x="550" y="210" font-size="13" font-weight="700" fill="#fff">#6B7688</text>
    <text x="550" y="226" font-size="10" fill="#e0e4ea">Texto secundario</text>
    <rect x="704" y="140" width="150" height="90" rx="10" fill="#f4f6fb" stroke="#e6eaf2"/>
    <text x="716" y="210" font-size="13" font-weight="700" fill="#1b2330">#F4F6FB</text>
    <text x="716" y="226" font-size="10" fill="#6b7688">Fondo</text>
  </g>

  <!-- PALETA CATEGÓRICA -->
  <text x="40" y="276" font-size="16" font-weight="700" fill="#1b2330">2. Paleta categórica (series de datos)</text>
  <g>
    <rect x="40" y="292" width="88" height="56" rx="8" fill="#e2001a"/><text x="52" y="372" font-size="10" fill="#6b7688">#E2001A</text>
    <rect x="136" y="292" width="88" height="56" rx="8" fill="#2563eb"/><text x="148" y="372" font-size="10" fill="#6b7688">#2563EB</text>
    <rect x="232" y="292" width="88" height="56" rx="8" fill="#f59e0b"/><text x="244" y="372" font-size="10" fill="#6b7688">#F59E0B</text>
    <rect x="328" y="292" width="88" height="56" rx="8" fill="#10b981"/><text x="340" y="372" font-size="10" fill="#6b7688">#10B981</text>
    <rect x="424" y="292" width="88" height="56" rx="8" fill="#8b5cf6"/><text x="436" y="372" font-size="10" fill="#6b7688">#8B5CF6</text>
    <rect x="520" y="292" width="88" height="56" rx="8" fill="#06b6d4"/><text x="532" y="372" font-size="10" fill="#6b7688">#06B6D4</text>
    <rect x="616" y="292" width="88" height="56" rx="8" fill="#ec4899"/><text x="628" y="372" font-size="10" fill="#6b7688">#EC4899</text>
    <rect x="712" y="292" width="88" height="56" rx="8" fill="#f97316"/><text x="724" y="372" font-size="10" fill="#6b7688">#F97316</text>
    <rect x="808" y="292" width="88" height="56" rx="8" fill="#14b8a6"/><text x="820" y="372" font-size="10" fill="#6b7688">#14B8A6</text>
  </g>

  <!-- SEMÁFORO / ESTADOS -->
  <text x="40" y="414" font-size="16" font-weight="700" fill="#1b2330">3. Colores de estado (semáforo KPIs)</text>
  <g>
    <rect x="40" y="430" width="200" height="50" rx="8" fill="#10b981"/><text x="56" y="460" font-size="13" font-weight="700" fill="#fff">Bueno / En meta</text>
    <rect x="256" y="430" width="200" height="50" rx="8" fill="#f59e0b"/><text x="272" y="460" font-size="13" font-weight="700" fill="#fff">Aceptable / Alerta</text>
    <rect x="472" y="430" width="200" height="50" rx="8" fill="#e2001a"/><text x="488" y="460" font-size="13" font-weight="700" fill="#fff">Malo / Crítico</text>
  </g>

  <!-- TIPOGRAFÍA -->
  <text x="40" y="528" font-size="16" font-weight="700" fill="#1b2330">4. Tipografía y jerarquía (Segoe UI)</text>
  <text x="40" y="566" font-size="30" font-weight="800" fill="#1b2330">Título H1 — 30px Bold</text>
  <text x="40" y="598" font-size="22" font-weight="700" fill="#e2001a">Subtítulo H2 — 22px Semibold (rojo)</text>
  <text x="40" y="626" font-size="16" font-weight="700" fill="#2563eb">Título de visual H3 — 16px (azul)</text>
  <text x="40" y="652" font-size="30" font-weight="800" fill="#1b2330">1.322 <tspan font-size="13" font-weight="400" fill="#6b7688">← Valor KPI 30px / etiqueta 13px</tspan></text>
  <text x="40" y="680" font-size="13" fill="#1b2330">Texto de cuerpo — 13px Regular, interlineado 1.5 para legibilidad.</text>
  <text x="40" y="702" font-size="11" fill="#6b7688">Etiqueta / nota al pie — 11px, color secundario, MAYÚSCULAS para encabezados de tabla.</text>
  <text x="40" y="738" font-size="11" fill="#93a0b5">Regla de jerarquía: cada nivel reduce ~30% el tamaño del anterior. Máx. 3 niveles por pantalla.</text>
</svg>
