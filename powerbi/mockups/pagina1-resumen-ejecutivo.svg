  <rect x="620" y="486" width="556" height="250" rx="14" fill="#fff" stroke="#e6eaf2"/>
  <text x="638" y="512" fill="#1b2330" font-size="14" font-weight="700">Marcas (treemap)</text>
  <g stroke="#fff" stroke-width="2">
    <rect x="638" y="524" width="270" height="130" fill="#64748b"/><text x="650" y="548" fill="#fff" font-size="13" font-weight="700">Genérico · 462</text>
    <rect x="908" y="524" width="250" height="130" fill="#e2001a"/><text x="920" y="548" fill="#fff" font-size="13" font-weight="700">Dell · 446</text>
    <rect x="638" y="654" width="150" height="70" fill="#f59e0b"/><text x="648" y="692" fill="#fff" font-size="12" font-weight="700">Avaya · 157</text>
    <rect x="788" y="654" width="110" height="70" fill="#8b5cf6"/><text x="798" y="692" fill="#fff" font-size="11">Apple · 78</text>
    <rect x="898" y="654" width="130" height="70" fill="#06b6d4"/><text x="908" y="692" fill="#fff" font-size="11">Xkim · 52</text>
    <rect x="1028" y="654" width="130" height="70" fill="#10b981"/><text x="1038" y="692" fill="#fff" font-size="11">Logitech · 28</text>
