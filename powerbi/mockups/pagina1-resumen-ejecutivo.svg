<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#f4f6fb"/>

  <!-- Header -->
  <rect x="24" y="20" width="52" height="52" rx="14" fill="#e2001a"/>
  <text x="50" y="54" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">UAO</text>
  <text x="90" y="42" fill="#1b2330" font-size="20" font-weight="700">Dashboard Ejecutivo · Bajas de Activos TI</text>
  <text x="90" y="62" fill="#6b7688" font-size="13">Resumen Ejecutivo · Solicitudes de baja (DITI) · 2025–2026</text>

  <!-- KPI row -->
  <g>
    <!-- card template -->
    <g>
      <rect x="24" y="92" width="222" height="92" rx="14" fill="#fff" stroke="#e6eaf2"/>
      <rect x="24" y="92" width="4" height="92" rx="2" fill="#e2001a"/>
      <text x="42" y="118" fill="#6b7688" font-size="11" font-weight="700">UNIDADES DADAS DE BAJA</text>
      <text x="42" y="152" fill="#1b2330" font-size="30" font-weight="800">1.322</text>
      <text x="42" y="172" fill="#6b7688" font-size="11">924 líneas de activo</text>
    </g>
    <g>
      <rect x="258" y="92" width="222" height="92" rx="14" fill="#fff" stroke="#e6eaf2"/>
      <rect x="258" y="92" width="4" height="92" rx="2" fill="#2563eb"/>
      <text x="276" y="118" fill="#6b7688" font-size="11" font-weight="700">SOLICITUDES (DITI)</text>
      <text x="276" y="152" fill="#1b2330" font-size="30" font-weight="800">104</text>
      <text x="276" y="172" fill="#6b7688" font-size="11">Promedio 12,7 u./solicitud</text>
    </g>
    <g>
      <rect x="492" y="92" width="222" height="92" rx="14" fill="#fff" stroke="#e6eaf2"/>
      <rect x="492" y="92" width="4" height="92" rx="2" fill="#f59e0b"/>
      <text x="510" y="118" fill="#6b7688" font-size="11" font-weight="700">UNIDADES 2025</text>
      <text x="510" y="152" fill="#1b2330" font-size="30" font-weight="800">651</text>
      <text x="510" y="172" fill="#6b7688" font-size="11">Año base</text>
    </g>
    <g>
      <rect x="726" y="92" width="222" height="92" rx="14" fill="#fff" stroke="#e6eaf2"/>
      <rect x="726" y="92" width="4" height="92" rx="2" fill="#10b981"/>
      <text x="744" y="118" fill="#6b7688" font-size="11" font-weight="700">UNIDADES 2026</text>
