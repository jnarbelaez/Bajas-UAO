  <rect x="24" y="486" width="580" height="250" rx="14" fill="#fff" stroke="#e6eaf2"/>
  <text x="42" y="512" fill="#1b2330" font-size="14" font-weight="700">Top categorías (unidades)</text>
  <g font-size="11" fill="#1b2330">
    <text x="42" y="540">Mouse</text><rect x="150" y="530" width="420" height="14" rx="3" fill="#8b5cf6"/><text x="578" y="541" fill="#6b7688">274</text>
    <text x="42" y="566">Teléfono</text><rect x="150" y="556" width="382" height="14" rx="3" fill="#f59e0b"/><text x="540" y="567" fill="#6b7688">249</text>
    <text x="42" y="592">Teclado</text><rect x="150" y="582" width="342" height="14" rx="3" fill="#10b981"/><text x="500" y="593" fill="#6b7688">223</text>
    <text x="42" y="618">Computador</text><rect x="150" y="608" width="226" height="14" rx="3" fill="#e2001a"/><text x="384" y="619" fill="#6b7688">147</text>
    <text x="42" y="644">Diadema/Audio</text><rect x="150" y="634" width="209" height="14" rx="3" fill="#06b6d4"/><text x="367" y="645" fill="#6b7688">136</text>
