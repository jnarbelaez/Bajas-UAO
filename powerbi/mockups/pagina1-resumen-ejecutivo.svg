    <rect x="260" y="310" width="16" height="130" fill="#2563eb"/><rect x="278" y="250" width="16" height="190" fill="#f59e0b"/>
    <rect x="320" y="330" width="16" height="110" fill="#2563eb"/><rect x="338" y="340" width="16" height="100" fill="#f59e0b"/>
    <rect x="380" y="300" width="16" height="140" fill="#2563eb"/><rect x="398" y="310" width="16" height="130" fill="#f59e0b"/>
    <rect x="440" y="240" width="16" height="200" fill="#2563eb"/><rect x="458" y="360" width="16" height="80" fill="#f59e0b"/>
    <rect x="500" y="330" width="16" height="110" fill="#2563eb"/><rect x="518" y="360" width="16" height="80" fill="#f59e0b"/>
