    <rect x="620" y="370" width="16" height="70" fill="#2563eb"/><rect x="638" y="350" width="16" height="90" fill="#f59e0b"/>
    <rect x="680" y="350" width="16" height="90" fill="#2563eb"/><rect x="698" y="360" width="16" height="80" fill="#f59e0b"/>
  </g>
  <rect x="600" y="216" width="12" height="12" fill="#2563eb"/><text x="616" y="226" fill="#6b7688" font-size="11">2025</text>
  <rect x="660" y="216" width="12" height="12" fill="#f59e0b"/><text x="676" y="226" fill="#6b7688" font-size="11">2026</text>

  <!-- Anillo: participación por año -->
  <rect x="800" y="200" width="376" height="270" rx="14" fill="#fff" stroke="#e6eaf2"/>
  <text x="818" y="226" fill="#1b2330" font-size="14" font-weight="700">Participación por año</text>
  <circle cx="930" cy="345" r="70" fill="none" stroke="#2563eb" stroke-width="34" stroke-dasharray="217 440" transform="rotate(-90 930 345)"/>
  <circle cx="930" cy="345" r="70" fill="none" stroke="#f59e0b" stroke-width="34" stroke-dasharray="223 440" stroke-dashoffset="-217" transform="rotate(-90 930 345)"/>
  <text x="930" y="350" fill="#1b2330" font-size="15" font-weight="800" text-anchor="middle">1.322</text>
  <rect x="1040" y="320" width="12" height="12" fill="#2563eb"/><text x="1058" y="330" fill="#6b7688" font-size="12">2025 · 49%</text>
  <rect x="1040" y="350" width="12" height="12" fill="#f59e0b"/><text x="1058" y="360" fill="#6b7688" font-size="12">2026 · 51%</text>

