<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#f4f6fb"/>

  <!-- Header -->
  <rect x="24" y="20" width="52" height="52" rx="14" fill="#e2001a"/>
  <text x="50" y="54" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">UAO</text>
  <text x="90" y="42" fill="#1b2330" font-size="20" font-weight="700">Calidad de Datos y Trazabilidad</text>
  <text x="90" y="62" fill="#6b7688" font-size="13">Control documental de seriales e inventario · Detección de duplicados</text>

  <!-- Tarjetas de calidad -->
  <g>
    <rect x="24" y="92" width="372" height="110" rx="14" fill="#fff" stroke="#e6eaf2"/>
    <rect x="24" y="92" width="4" height="110" rx="2" fill="#f59e0b"/>
    <text x="42" y="120" fill="#6b7688" font-size="12" font-weight="700">% SIN NÚMERO DE SERIE</text>
    <text x="42" y="162" fill="#1b2330" font-size="34" font-weight="800">22,3%</text>
    <text x="150" y="162" fill="#6b7688" font-size="13">(206 registros)</text>
    <rect x="42" y="178" width="336" height="10" rx="5" fill="#f4f6fb" stroke="#e6eaf2"/>
    <rect x="42" y="178" width="75" height="10" rx="5" fill="#f59e0b"/>
  </g>
  <g>
    <rect x="414" y="92" width="372" height="110" rx="14" fill="#fff" stroke="#e6eaf2"/>
    <rect x="414" y="92" width="4" height="110" rx="2" fill="#e2001a"/>
    <text x="432" y="120" fill="#6b7688" font-size="12" font-weight="700">% SIN N° DE INVENTARIO</text>
    <text x="432" y="162" fill="#1b2330" font-size="34" font-weight="800">40,4%</text>
    <text x="548" y="162" fill="#6b7688" font-size="13">(373 registros)</text>
    <rect x="432" y="178" width="336" height="10" rx="5" fill="#f4f6fb" stroke="#e6eaf2"/>
    <rect x="432" y="178" width="136" height="10" rx="5" fill="#e2001a"/>
  </g>
  <g>
    <rect x="804" y="92" width="372" height="110" rx="14" fill="#fff" stroke="#e6eaf2"/>
    <rect x="804" y="92" width="4" height="110" rx="2" fill="#2563eb"/>
    <text x="822" y="120" fill="#6b7688" font-size="12" font-weight="700">LÍNEAS TIPO LOTE (CANT &gt; 1)</text>
    <text x="822" y="162" fill="#1b2330" font-size="34" font-weight="800">8,3%</text>
    <text x="920" y="162" fill="#6b7688" font-size="13">(77 registros)</text>
    <rect x="822" y="178" width="336" height="10" rx="5" fill="#f4f6fb" stroke="#e6eaf2"/>
    <rect x="822" y="178" width="28" height="10" rx="5" fill="#2563eb"/>
  </g>

  <!-- Columnas apiladas: Categoría x TieneInventario -->
  <rect x="24" y="218" width="570" height="300" rx="14" fill="#fff" stroke="#e6eaf2"/>
  <text x="42" y="244" fill="#1b2330" font-size="14" font-weight="700">Registros por categoría × ¿Tiene inventario?</text>
  <line x1="60" y1="488" x2="576" y2="488" stroke="#e6eaf2"/>
  <g>
    <!-- apiladas: verde=Si, rojo=No -->
    <rect x="80" y="300" width="40" height="120" fill="#10b981"/><rect x="80" y="420" width="40" height="68" fill="#e2001a"/>
    <text x="100" y="505" fill="#6b7688" font-size="10" text-anchor="middle">Mouse</text>
    <rect x="160" y="320" width="40" height="100" fill="#10b981"/><rect x="160" y="420" width="40" height="68" fill="#e2001a"/>
    <text x="180" y="505" fill="#6b7688" font-size="10" text-anchor="middle">Teléf.</text>
    <rect x="240" y="300" width="40" height="188" fill="#e2001a"/>
    <text x="260" y="505" fill="#6b7688" font-size="10" text-anchor="middle">Teclado</text>
    <rect x="320" y="320" width="40" height="168" fill="#10b981"/>
    <text x="340" y="505" fill="#6b7688" font-size="10" text-anchor="middle">Comput.</text>
    <rect x="400" y="400" width="40" height="30" fill="#10b981"/><rect x="400" y="430" width="40" height="58" fill="#e2001a"/>
    <text x="420" y="505" fill="#6b7688" font-size="10" text-anchor="middle">Diadema</text>
    <rect x="480" y="360" width="40" height="70" fill="#10b981"/><rect x="480" y="430" width="40" height="58" fill="#e2001a"/>
    <text x="500" y="505" fill="#6b7688" font-size="10" text-anchor="middle">Monitor</text>
  </g>
  <rect x="400" y="234" width="12" height="12" fill="#10b981"/><text x="416" y="244" fill="#6b7688" font-size="11">Sí</text>
  <rect x="450" y="234" width="12" height="12" fill="#e2001a"/><text x="466" y="244" fill="#6b7688" font-size="11">No</text>

  <!-- Tabla: registros sin inventario -->
  <rect x="610" y="218" width="566" height="300" rx="14" fill="#fff" stroke="#e6eaf2"/>
  <text x="628" y="244" fill="#1b2330" font-size="14" font-weight="700">Registros a regularizar (sin inventario)</text>
  <g font-size="11">
    <text x="628" y="270" fill="#6b7688" font-weight="700">Consecutivo</text>
    <text x="760" y="270" fill="#6b7688" font-weight="700">Descripción</text>
    <text x="1040" y="270" fill="#6b7688" font-weight="700">Serie No.</text>
    <line x1="628" y1="280" x2="1158" y2="280" stroke="#e6eaf2"/>
    <g fill="#1b2330">
      <text x="628" y="304">DITI-8.6-06</text><text x="760" y="304">Teclado DELL</text><text x="1040" y="304" font-family="monospace" font-size="10">CN08NYJV...</text>
      <text x="628" y="330">DITI-4.6-16</text><text x="760" y="330">Diadema Study Room</text><text x="1040" y="330" font-family="monospace" font-size="10">—</text>
      <text x="628" y="356">DITI-4.6-30</text><text x="760" y="356">Lote Mouse (15)</text><text x="1040" y="356" font-family="monospace" font-size="10">—</text>
      <text x="628" y="382">DITI-4.4-24</text><text x="760" y="382">Teclado Logitech</text><text x="1040" y="382" font-family="monospace" font-size="10">2222MR07...</text>
      <text x="628" y="408">DITI-4.4-36</text><text x="760" y="408">Mouse (2)</text><text x="1040" y="408" font-family="monospace" font-size="10">—</text>
      <text x="628" y="434">DITI-4.4-56</text><text x="760" y="434">Lote de Cables y guayas</text><text x="1040" y="434" font-family="monospace" font-size="10">—</text>
      <text x="628" y="460">DITI-4.4-67</text><text x="760" y="460">Mouse (22)</text><text x="1040" y="460" font-family="monospace" font-size="10">—</text>
    </g>
  </g>

  <!-- Tabla: seriales duplicados -->
  <rect x="24" y="534" width="1152" height="202" rx="14" fill="#fff" stroke="#e6eaf2"/>
  <text x="42" y="560" fill="#1b2330" font-size="14" font-weight="700">Seriales repetidos — posible doble baja (control)</text>
  <g font-size="11">
    <text x="42" y="586" fill="#6b7688" font-weight="700">Serie No.</text>
    <text x="400" y="586" fill="#6b7688" font-weight="700">Repeticiones</text>
    <text x="600" y="586" fill="#6b7688" font-weight="700">Observación</text>
    <line x1="42" y1="596" x2="1158" y2="596" stroke="#e6eaf2"/>
    <g fill="#1b2330">
      <text x="42" y="620" font-family="monospace">17332000376</text><text x="430" y="620">2</text><text x="600" y="620" fill="#6b7688">Verificar re-registro entre 2026-04 y 2026-05</text>
      <text x="42" y="646" font-family="monospace">RV8J10W9JKA</text><text x="430" y="646">2</text><text x="600" y="646" fill="#6b7688">Dos celulares Samsung con misma serie</text>
      <text x="42" y="672" font-family="monospace">4CJ000962</text><text x="430" y="672">2</text><text x="600" y="672" fill="#6b7688">Tableta Wacom duplicada (DITI-4.4-51 y 57)</text>
      <text x="42" y="698" font-family="monospace">CNOC639N7161637Q00HFA00</text><text x="430" y="698">2</text><text x="600" y="698" fill="#6b7688">Teclado Dell repetido</text>
    </g>
  </g>
  <text x="24" y="752" fill="#93a0b5" font-size="11">Mockup ilustrativo · Esta página apoya el control documental del administrador de activos</text>
</svg>
